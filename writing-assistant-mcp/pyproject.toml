[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "writing-assistant-mcp"
version = "0.1.0"
description = "MCP server that detects AI-sounding writing, explains why, and guides the host LLM's rewrite"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["mcp>=2.2"]

[project.optional-dependencies]
model = ["torch>=2.2", "transformers>=4.40", "sentencepiece", "protobuf"]
dev = ["pytest>=8"]

[project.scripts]
writing-assistant-mcp = "writing_assistant_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/writing_assistant_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
